# CI for the template repo itself: renders the template and exercises the renders,
# checks direct update paths from recent and historical releases, and validates the
# agent skill.
# (Released template versions are additionally gated on the downstream
# jlevy/simple-modern-uv-template repo's CI; see updating.md.)

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  # Pinned tool versions used to exercise the template. Keep the uv version in
  # sync with template/.github/workflows/ci.yml when updating.
  UV_VERSION: "0.12.3"
  UV_CHECKSUM: "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101"
  COPIER_SPEC: "copier@9.17.0"
  # Default answers for test renders.
  RENDER_ARGS: >-
    --data package_name=smoke-test
    --data "package_description=Render smoke test"
    --data "package_author_name=Test Author"
    --data package_author_email=test@example.com
    --data package_github_org=testorg

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          enable-cache: false
      - name: Check doc formatting
        run: make format-check

  render-test:
    strategy:
      matrix:
        include:
          - variant: default
            extra_args: ""
          - variant: no-publish-proprietary
            extra_args: "--data package_license=Proprietary --data publish_to_pypi=false"
          - variant: no-license
            extra_args: "--data package_license=None"
    runs-on: ubuntu-latest
    env:
      # Supply-chain cool-off for template dependency resolution, matching the
      # template's own CI and the Makefile default (see updating.md).
      UV_EXCLUDE_NEWER: "14 days"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          enable-cache: true
          # setup-uv v9 defaults to retaining wheels to reduce PyPI load. Keep
          # that tradeoff explicit so a future action default cannot change it.
          prune-cache: false
          python-version: "3.12"

      - name: Render template (${{ matrix.variant }})
        run: |
          eval uvx "$COPIER_SPEC" copy --defaults --vcs-ref=$GITHUB_SHA \
            $RENDER_ARGS ${{ matrix.extra_args }} "$GITHUB_WORKSPACE" /tmp/render

      - name: Inspect variant-specific output
        run: |
          cd /tmp/render
          case "${{ matrix.variant }}" in
            default)
              test -f .github/workflows/publish.yml
              test -f docs/publishing.md
              grep -q 'license = "MIT"' pyproject.toml
              head -1 LICENSE | grep -q "MIT License"
              # Only the commented-out form may appear in the default render:
              ! grep -qE '^\s*"Private :: Do Not Upload",' pyproject.toml
              grep -q 'uv sync --locked --all-extras --all-groups' \
                .github/workflows/ci.yml
              grep -q 'uv sync --locked --all-extras --all-groups' \
                .github/workflows/publish.yml
              grep -q 'uv sync --locked --only-group build' \
                .github/workflows/publish.yml
              grep -Fq 'github.workspace }}/uv.toml' .github/workflows/ci.yml
              grep -Fq 'github.workspace }}/uv.toml' .github/workflows/publish.yml
              grep -q 'enable-cache: false' .github/workflows/publish.yml
              # The publish workflow's job/permission/trigger structure is asserted
              # against the parsed YAML in the next step; only the reviewed action
              # pins are matched textually here.
              grep -q 'actions/upload-artifact@043fb46d' .github/workflows/publish.yml
              grep -q 'actions/download-artifact@3e5f45b' .github/workflows/publish.yml
              grep -Fq 'github.com/testorg/smoke-test/blob/main/.github/workflows/publish.yml' \
                docs/publishing.md
              grep -Fq 'Project: `smoke-test`' docs/publishing.md
              grep -Fq 'Environment: `pypi`' docs/publishing.md
              grep -q 'exclude-newer-package' docs/development.md
              ! grep -q '{{' docs/publishing.md
              ! grep -qE '\b(OWNER|PROJECT)\b' docs/publishing.md
              ;;
            no-publish-proprietary)
              test ! -e .github/workflows/publish.yml
              test ! -e docs/publishing.md
              grep -q 'license = "LicenseRef-Proprietary"' pyproject.toml
              grep -qE '^\s*"Private :: Do Not Upload",' pyproject.toml
              ;;
            no-license)
              test ! -e LICENSE
              ! grep -qE '^license = ' pyproject.toml
              grep -q "No license chosen yet" pyproject.toml
              test -f .github/workflows/publish.yml
              ;;
          esac
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f uv.toml
          grep -q '## Working with a Coding Agent' README.md
          grep -q 'simple-modern-uv/tree/main/skills/simple-modern-uv' AGENTS.md
          grep -q 'required-version = ">=0.12.0,<0.13"' uv.toml
          grep -q 'exclude-newer = "14 days"' uv.toml
          ! grep -q '^\[tool\.uv\]' pyproject.toml
          grep -q 'UV_CONFIG_FILE := .*uv.toml' Makefile
          grep -q '^\[tool\.hatch\.build\.targets\.sdist\]' pyproject.toml
          ! grep -q '"E402"' pyproject.toml
          ! grep -q '^reportIgnoreCommentWithoutRule' pyproject.toml
          ! grep -q '^reportUnnecessaryTypeIgnoreComment' pyproject.toml
          grep -q '@AGENTS.md' CLAUDE.md
          test -f .copier-answers.yml
          uvx flowmark-rs@0.3.2 --auto --check .

      - name: Check publish workflow structure
        if: matrix.variant == 'default'
        # Which job may request the PyPI credential, what else that job is allowed
        # to do, and how the workflow can be triggered are the most important
        # assertions here. Check them against the parsed YAML, so they cannot be
        # broken by a comment that mentions a permission or satisfied by one that
        # landed in the wrong job.
        run: |
          uv run --no-project --with pyyaml python \
            "$GITHUB_WORKSPACE/.github/scripts/check_publish_workflow.py" \
            /tmp/render/.github/workflows/publish.yml

      - name: Init git and install (the documented setup sequence)
        # Mirrors the next-steps the template prints: commit first, then sync, so
        # dynamic versioning gives the editable install a real version.
        run: |
          cd /tmp/render
          export UV_CONFIG_FILE="$PWD/uv.toml"
          git init -q --initial-branch=main
          git add -A
          git -c user.email=ci@example.com -c user.name=CI commit -qm "Initial commit"
          uv sync --all-extras --all-groups
          uv sync --locked --all-extras --all-groups
          V=$(uv run python -c "from importlib.metadata import version; print(version('smoke-test'))")
          echo "installed version: $V"
          test "$V" != "0.0.0"
          (cd /tmp && uv --project /tmp/render lock --check)

      - name: Lint, test, build
        run: |
          cd /tmp/render
          export UV_CONFIG_FILE="$PWD/uv.toml"
          mkdir -p tests/review-fixtures
          cp "$GITHUB_WORKSPACE/.github/fixtures/ruff-markdown-input.txt" \
            tests/review-fixtures/ruff-markdown.md
          uv run python devtools/lint.py --check
          uv run pytest
          git tag v0.1.0
          uv build --no-build-isolation
          ls dist/ | grep -q "smoke_test-0.1.0-py3-none-any.whl"
          SDIST=$(find dist -name '*.tar.gz' -print -quit)
          test -n "$SDIST"
          ! tar -tzf "$SDIST" | grep -Eq '/(\.github|\.agents|\.claude|\.codex)/'
          ! tar -tzf "$SDIST" | grep -Eq '/(AGENTS\.md|CLAUDE\.md|uv\.lock)$'

      - name: Exercise the locked build-only publish environment
        if: matrix.variant == 'default'
        run: |
          cd /tmp/render
          export UV_CONFIG_FILE="$PWD/uv.toml"
          export UV_PROJECT_ENVIRONMENT=/tmp/build-venv
          uv sync --locked --only-group build
          uv build --no-build-isolation --out-dir /tmp/build-dist
          test -n "$(find /tmp/build-dist -name '*.whl' -print -quit)"
          test -n "$(find /tmp/build-dist -name '*.tar.gz' -print -quit)"

  publish-preflight:
    # The rendered publish job holds no ordinary GITHUB_TOKEN scope: it declares only
    # `id-token: write`, checks nothing out, and has no project directory. Two
    # assumptions ride on that, and a real release is a bad place to find out: that
    # setup-uv installs an exactly pinned uv without a GitHub API call, and that a
    # same-run artifact download works without `actions: read`. `permissions: {}` is
    # strictly tighter than the real job, which adds only `id-token: write`.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          enable-cache: false
      - name: Stand in for a built distribution
        run: |
          mkdir -p dist
          printf 'preflight\n' > dist/preflight-0.0.0-py3-none-any.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 1
      - name: Drop the local copy, so the download has to supply it
        run: rm -rf dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-distributions
          path: dist
      - name: Check the publish job's toolchain and inputs
        run: |
          test "$(uv --version | cut -d' ' -f2)" = "$UV_VERSION"
          test -s dist/preflight-0.0.0-py3-none-any.whl
          uv publish --help > /dev/null

  update-path:
    # Direct updates from the previous release and representative historical baselines
    # must converge to this commit. A customized fixture also verifies that Copier
    # preserves a realistic local delta across the long-range update.
    strategy:
      fail-fast: false
      matrix:
        source: [previous-release, v0.4.0, v0.2.20]
    runs-on: ubuntu-latest
    env:
      UV_EXCLUDE_NEWER: "14 days"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          enable-cache: false

      - name: Render from ${{ matrix.source }}
        run: |
          if [ "${{ matrix.source }}" = previous-release ]; then
            SOURCE_REF=$(git describe --tags --abbrev=0 "$GITHUB_SHA")
          else
            SOURCE_REF="${{ matrix.source }}"
          fi
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "Updating directly from $SOURCE_REF to $GITHUB_SHA"
          eval uvx "$COPIER_SPEC" copy --defaults --vcs-ref="$SOURCE_REF" \
            $RENDER_ARGS --data package_module=smoke_test \
            "$GITHUB_WORKSPACE" /tmp/old
          cd /tmp/old
          git init -q --initial-branch=main
          git add -A
          git -c user.email=ci@example.com -c user.name=CI commit -qm "From $SOURCE_REF"

      - name: Update to candidate commit with defaults
        run: |
          cd /tmp/old
          eval uvx "$COPIER_SPEC" update --defaults --skip-answered \
            --vcs-ref=$GITHUB_SHA --data package_license=MIT \
            --data publish_to_pypi=true
          # No conflicts:
          REJ=$(find . -name '*.rej' | wc -l); test "$REJ" -eq 0
          # Converges to a fresh render of the candidate (the answers file differs
          # only by _commit/_src_path bookkeeping, so exclude it):
          eval uvx "$COPIER_SPEC" copy --defaults --vcs-ref=$GITHUB_SHA \
            $RENDER_ARGS --data package_module=smoke_test \
            --data package_license=MIT --data publish_to_pypi=true \
            "$GITHUB_WORKSPACE" /tmp/fresh
          diff -r --exclude=.git --exclude=.copier-answers.yml /tmp/old /tmp/fresh
          export UV_CONFIG_FILE="$PWD/uv.toml"
          uv sync --all-extras --all-groups
          # The sync above writes uv.lock, so re-running it with --locked could not
          # fail. Check the lock from another directory instead, as render-test does.
          (cd /tmp && uv --project /tmp/old lock --check)
          uv run python devtools/lint.py --check
          uv run pytest

      - name: Direct update preserves project customizations
        run: |
          eval uvx "$COPIER_SPEC" copy --defaults --vcs-ref="$SOURCE_REF" \
            $RENDER_ARGS --data package_module=smoke_test \
            "$GITHUB_WORKSPACE" /tmp/custom
          cd /tmp/custom
          mkdir -p docs
          printf '%s\n' '# Project Policy' '' 'Repository-specific guidance.' \
            > docs/project-policy.md
          # Source shaped like a long-lived project: a module-level import after
          # code and an unqualified pyright suppression, both exempted by earlier
          # template defaults.
          mkdir -p src/smoke_test
          cat > src/smoke_test/legacy.py <<'LEGACY'
          """Module written before the template tightened its lint and type defaults."""

          DEFAULT_TIMEOUT = 30

          import os


          def timeout_from_env() -> int:
              raw = os.environ.get("TIMEOUT", "")  # pyright: ignore
              return int(raw) if raw else DEFAULT_TIMEOUT
          LEGACY
          sed -i 's/# ignore-words-list = "foo,bar"/ignore-words-list = "fo"/' \
            pyproject.toml
          # sed does not fail on a non-match, so check it landed here rather than
          # letting a reworded template comment surface later as an unrelated failure.
          grep -q '^ignore-words-list = "fo"$' pyproject.toml
          git init -q --initial-branch=main
          git add -A
          git -c user.email=ci@example.com -c user.name=CI commit -qm "Customized"
          eval uvx "$COPIER_SPEC" update --defaults --skip-answered \
            --vcs-ref=$GITHUB_SHA --data package_license=MIT \
            --data publish_to_pypi=true
          REJ=$(find . -name '*.rej' | wc -l); test "$REJ" -eq 0
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .
          test -f docs/project-policy.md
          grep -q '^ignore-words-list = "fo"$' pyproject.toml

      - name: Stricter lint and type defaults reach the established project
        if: matrix.source == 'previous-release'
        # This candidate re-enables Ruff E402 and the BasedPyright ignore-comment
        # rules. Copier applies both as clean, non-conflicting hunks, so a project
        # carrying either idiom starts failing `make lint` right after a routine
        # update. Assert that, naming the rules, so the break stays deliberate
        # instead of being discovered downstream; then check that the findings are
        # ordinary ones the project can fix.
        run: |
          cd /tmp/custom
          export UV_CONFIG_FILE="$PWD/uv.toml"
          uv sync --all-extras --all-groups
          LINT_RC=0
          uv run python devtools/lint.py --check > /tmp/lint-out.txt 2>&1 || LINT_RC=$?
          # Prefix every replayed line, so basedpyright's `::warning::` output does
          # not raise annotations for findings this step expects. Indenting is not
          # enough: the Actions log parser trims leading whitespace before matching
          # a workflow command, so the prefix has to be a non-space character.
          sed 's/^/| /' /tmp/lint-out.txt
          test "$LINT_RC" -ne 0
          grep -q 'E402' /tmp/lint-out.txt
          grep -q 'reportIgnoreCommentWithoutRule' /tmp/lint-out.txt
          grep -q 'reportUnnecessaryTypeIgnoreComment' /tmp/lint-out.txt
          cat > src/smoke_test/legacy.py <<'FIXED'
          """Module updated for the template's stricter lint and type defaults."""

          import os

          DEFAULT_TIMEOUT = 30


          def timeout_from_env() -> int:
              raw = os.environ.get("TIMEOUT", "")
              return int(raw) if raw else DEFAULT_TIMEOUT
          FIXED
          uv run python devtools/lint.py --check

      - name: Update honors --data overrides for newer questions
        if: matrix.source == 'previous-release'
        run: |
          eval uvx "$COPIER_SPEC" copy --defaults \
            --vcs-ref="$SOURCE_REF" $RENDER_ARGS \
            --data package_module=smoke_test "$GITHUB_WORKSPACE" /tmp/old2
          cd /tmp/old2
          git init -q --initial-branch=main
          git add -A
          git -c user.email=ci@example.com -c user.name=CI commit -qm "old"
          eval uvx "$COPIER_SPEC" update --defaults --skip-answered \
            --vcs-ref=$GITHUB_SHA --data publish_to_pypi=false
          test ! -e .github/workflows/publish.yml
          grep -qE '^\s*"Private :: Do Not Upload",' pyproject.toml

  skill-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate skill structure and frontmatter
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          NPM_CONFIG_BEFORE: "2026-06-29T03:27:33Z"
        run: npx --yes skills-ref@0.1.5 validate skills/simple-modern-uv
      - name: Check agent installation selects this repository's public skill
        run: grep -q -- '--skill simple-modern-uv --yes' README.md
      - name: Check that relative links in skill docs resolve
        run: |
          cd skills/simple-modern-uv
          FAIL=0
          for f in SKILL.md references/*.md; do
            dir=$(dirname "$f")
            for link in $(grep -oE '\]\(([^)#]+)\)' "$f" | sed 's/](\(.*\))/\1/'); do
              case "$link" in
                http*|mailto:*) continue ;;
              esac
              if [ ! -e "$dir/$link" ]; then
                echo "BROKEN: $f -> $link"; FAIL=1
              fi
            done
          done
          exit $FAIL
