# Copier configuration.

_min_copier_version: "9.4.0"
_subdirectory: template
_message_after_copy: |
    Your package template has been copied!

    Remember to look for any unfilled `changeme` strings and confirm the license!
    By default this template uses MIT license.
    See `license` in pyproject.toml and update the LICENSE file.

    Next steps:
    
    cd PROJECT
    git init --initial-branch=main
    # Make license or other initial adjustments if needed.
    git add .
    git commit -m "Initial commit from simple-modern-uv."
    # Create repo on GitHub.
    git remote add origin git@github.com:OWNER/PROJECT.git  # or https://...
    git push -u origin main

package_name:
    type: str
    help: What is the package name? (This will be the GitHub repo and PyPI package name, so use CamelCase, dash-case, or snake_case. This is the only required field.)
    default: changeme

package_module:
    type: str
    help: Package module name? (This is the Python module, so use snake_case. Or press enter to derive it from the package name.)
    # Derive a valid module name from the package name so dash-case or CamelCase
    # names (fine for GitHub/PyPI) don't silently produce a broken Python module.
    default: "{{ package_name|lower|replace('-', '_') }}"
    # A Python module name must be a valid identifier and is conventionally
    # lowercase snake_case; dashes/spaces/leading digits produce code that won't
    # import (e.g. `from .polars-row-collector import *`).
    validator: >-
        {% if not package_module.isidentifier() or package_module != package_module.lower() %}
        package_module must be a lowercase, snake_case Python module name (no dashes, spaces, or leading digits). For example, use "polars_row_collector" instead of "polars-row-collector".
        {% endif %}

package_description:
    type: str
    help: Package description? (Press enter to fill in later.)
    default: changeme

package_author_name:
    type: str
    help: Package author name? (Press enter to fill in later.)
    default: changeme

package_author_email:
    type: str
    help: Package author email? (Press enter to fill in later.)
    default: changeme@example.com

package_github_org:
    type: str
    help: Package GitHub org or username? (Press enter to fill in later.)
    default: changeme
